server:
  host: 0.0.0.0
  port: 8000
  cors_origins:
  - '*'
paths:
  db_path: data/traffic.db
  evidence_dir: data/evidence
  logs_dir: logs
  model_path: models/best.onnx
  plate_model_path: models/plate_detector.onnx
logging:
  level: INFO
  max_bytes: 52428800
  backup_count: 5
ai:
  device: cpu
  providers:
  - CPUExecutionProvider
  imgsz: 640
  default_conf: 0.4
  iou_threshold: 0.45
  per_class_conf:
    0: 0.45
    1: 0.25
    2: 0.3
    3: 0.45
    4: 0.42
    5: 0.42
    6: 0.5
    7: 0.5
  classes:
    0: car
    1: motorcycle
    2: bicycle
    3: bus
    4: truck
    5: tricycle
    6: ambulance
    7: fire_truck
  exempt_classes:
  - 6
  - 7
tracking:
  track_buffer: 75
  class_smoothing_window: 8
rules:
  stationary_speed_px_per_sec: 15.0
  grace_period_sec: 1.5
  occlusion_iou_threshold: 0.65
  occlusion_max_gap_sec: 5.0
  wrong_lane_min_frames: 6
  violation_cooldown_sec: 60.0
deduplication:
  enabled: true
  plate_cooldown_sec: 600.0
  false_positive_cooldown_sec: 1800.0
  max_plate_edit_dist: 1
  spatial_iou_threshold: 0.65
  exit_grace_sec: 45.0
  update_existing_duration: true
perspective_and_rendering:
  roi_display_mode: border_only
  roi_alpha: 0.2
  use_static_mask_cache: true
  dual_contrast_border: true
  ground_contact_mode: bottom_center
  draw_ground_contact_marker: true
  enable_homography: false
  homography_landmarks: []
ocr:
  workers: 1
  queue_maxsize: 100
  min_ocr_conf: 0.55
  vn_plate_regex: ^[0-9]{2}[A-Z]{1,2}[0-9]?-?[0-9]{4,5}$
monitoring:
  interval_sec: 2.0
  history_size: 180
  warn_cpu_percent: 85.0
  warn_ram_percent: 85.0
  warn_gpu_percent: 90.0
  warn_disk_free_gb: 5.0
retention:
  enabled: true
  run_at_hour: 2
  retention_days: 30
